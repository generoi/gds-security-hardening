name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    # Lint and static analysis only; it has never run past a minute.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer stan

  test:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 360-minute ceiling. On
    # 2026-08-18 two runs wedged in `playwright install` and held a runner
    # for six hours each before GitHub killed them, which cost more than
    # this repository spends in a normal month. A cold browser download
    # can legitimately push the job past 10 minutes, so this is set at
    # roughly twice that — reaching it means wedged, not slow.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: composer install --no-interaction --prefer-dist
      - run: npm install --no-audit --no-fund

      - name: Start WordPress
        run: npx wp-env start

      - name: PHP integration tests
        run: npm run test:php

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
